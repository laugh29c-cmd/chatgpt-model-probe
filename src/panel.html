<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPT Route Probe</title>
<style>
:root{font:14px/1.5 system-ui,sans-serif;color:#252729;background:#f5f6f7;letter-spacing:0}*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:auto;padding:18px}header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #cbd0d5;padding-bottom:12px}h1{font-size:19px;margin:0;margin-right:auto}button,input,select{font:inherit;min-height:34px;border:1px solid #b9c0c5;border-radius:5px;background:white;color:inherit;padding:4px 9px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover{background:#edf2ef}input{width:180px}select{min-width:0;flex:1}label{display:inline-flex;align-items:center;gap:6px}label input[type=checkbox]{width:18px;min-height:18px}.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #d6dadd}.bar small{color:#686e76}#status{font-weight:600;color:#1c745b}#notice{color:#a45a13;overflow-wrap:anywhere;margin:8px 0}#receipt{padding:16px 0;border-bottom:1px solid #cbd0d5}#model{font-size:22px;color:#236954;overflow-wrap:anywhere}dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:5px 12px;margin:12px 0}dt{color:#626873}dd{margin:0;overflow-wrap:anywhere}.table-wrap{overflow:auto;max-height:380px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #d6dadd;max-width:260px;overflow-wrap:anywhere}th{position:sticky;top:0;background:#f5f6f7}#raw-network{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:200px;overflow:auto}.compact .details{display:none}.compact main{padding:10px}.compact h1{font-size:15px}.compact #model{font-size:17px}.compact #receipt{padding:10px 0}.compact header{padding-bottom:5px}@media(max-width:480px){main{padding:12px}h1{font-size:17px}dl{grid-template-columns:104px minmax(0,1fr)}input{width:150px}.bar select{flex-basis:100%}#model{font-size:19px}}
</style>
<main><header><h1>ChatGPT Route Probe <small>1.5.1</small></h1><label title="停止时不再采集"><input type="checkbox" id="enabled">观察</label><button id="collapse" title="收起" aria-label="收起">−</button><button id="float" title="独立浮窗">浮窗</button></header>
<div id="notice" role="status"></div><div id="status">未连接采集源</div>
<section class="bar details"><button id="discover">查找目标</button><select id="targets" aria-label="采集目标"><option value="">未选择目标</option></select><button id="connect">连接</button></section>
<section id="receipt"><div id="model">未观测到返回模型</div><div id="evidence">metadata_unavailable</div><dl class="details" id="fields"></dl><div class="details"><button data-label="normal">正常</button> <button data-label="suspicious">可疑</button> <button data-label="drift">明显漂移</button></div></section>
<section class="bar details"><label>网络标签 <input id="network-tag" maxlength="40" placeholder="网线 / Wi-Fi / 节点代号"></label><label>账号代号 <input id="account-tag" maxlength="40" placeholder="A / B"></label><button id="tags">应用</button><button id="login">标记刚登录</button><small id="login-status">登录时间未标记</small></section>
<section class="bar details"><button id="network">网络快照</button><button id="export">导出 JSON</button><button id="import">导入回执</button><input id="file" type="file" accept=".json,.jsonl" hidden><small id="count">0 条记录</small></section><pre id="raw-network" class="details"></pre>
<div class="table-wrap details"><table><thead><tr><th>时间</th><th>入口</th><th>请求</th><th>返回字段</th><th>证据</th><th>网络</th><th>标签</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>
const $=id=>document.getElementById(id)||pip?.document.getElementById(id);let state=null,current=null,imported=false,pip=null;
const main=()=>pip?.document.querySelector('main')||document.querySelector('main');
const statusNames={not_connected:'未连接采集源',observing_renderer_only:'已连接：渲染进程可见流量',paused:'观察已暂停',disconnected:'采集源已断开',ledger_write_failed:'日志写入失败',observer_error:'观察发生错误'};
const reported=r=>r?.reroute?.to_model||r?.server_ste_model_slug||r?.provider_response_model||r?.resolved_model_slug||r?.message_model_slug||null;
function show(r){current=r;$('model').textContent=reported(r)||'未观测到返回模型';$('evidence').textContent=r?.evidence_state||'metadata_unavailable';$('fields').replaceChildren();for(const [name,value] of [['入口',r?.surface],['请求模型',r?.requested_model],['消息模型',r?.message_model_slug],['解析模型',r?.resolved_model_slug],['STE 字段',r?.server_ste_model_slug],['响应 model',r?.provider_response_model],['状态',r?.status],['覆盖范围',r?.coverage||r?.record_kind],['事件数',r?.diagnostics?.events],['其他模型字段',JSON.stringify(r?.diagnostics?.model_candidates||[])],['网络 ID',r?.network_at_end?.network_id||r?.network?.network_id],['登录后毫秒',r?.login_elapsed_ms],['人工标签',r?.behavior_label]]){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=name;dd.textContent=value??'—';$('fields').append(dt,dd);}main().querySelectorAll('[data-label]').forEach(b=>b.disabled=!r||imported);}
function render(s){state=s;$('status').textContent=imported?'导入回执（非实时采集）':(statusNames[s.status]||s.status);$('enabled').checked=s.status==='observing_renderer_only';$('count').textContent=s.records.length+' 条显示 · 限流丢弃 '+(s.dropped||0);$('login-status').textContent=s.login?'登录标记 '+new Date(s.login).toLocaleTimeString():'登录时间未标记';$('rows').replaceChildren();for(const r of [...s.records].reverse()){const tr=document.createElement('tr');for(const value of [r.timestamp,r.surface,r.requested_model,reported(r),r.evidence_state,r.network_tag,r.behavior_label]){const td=document.createElement('td');td.textContent=value??'—';tr.append(td);}tr.tabIndex=0;tr.onclick=()=>show(r);tr.onkeydown=e=>{if(e.key==='Enter')show(r);};$('rows').append(tr);}show(s.records.at(-1));}
async function control(body){const response=await fetch('/api/control',{method:'POST',headers:{'content-type':'application/json','x-probe-token':state.csrf},body:JSON.stringify(body)});if(!response.ok)throw Error((await response.json()).error);}
function action(id,fn){$(id).onclick=async()=>{try{$('notice').textContent='';await fn();}catch(e){$('notice').textContent=e.message==='CDP_NOT_AVAILABLE'?'未发现 CDP：目标应用须支持并开启本地调试端口。':e.message;}};}
action('discover',async()=>{const response=await fetch('/api/targets');const data=await response.json();if(!response.ok)throw Error(data.error);$('targets').replaceChildren();for(const t of data){const o=document.createElement('option');o.value=t.id;o.textContent=t.type+' · '+(t.title||t.url||t.id);$('targets').append(o);}if(!data.length)throw Error('未发现可附加目标');});
action('connect',async()=>{if(!$('targets').value)throw Error('请先选择一个目标');imported=false;await control({action:'connect',target_id:$('targets').value});});
action('enabled',async()=>{if(!$('enabled').checked)await control({action:'pause'});else{if(!$('targets').value){$('enabled').checked=false;throw Error('请先查找并选择目标');}await control({action:'connect',target_id:$('targets').value});}});
action('login',()=>control({action:'login'}));action('tags',()=>control({action:'tags',network_tag:$('network-tag').value,account_tag:$('account-tag').value}));
action('network',async()=>{$('raw-network').textContent=JSON.stringify(await(await fetch('/api/network')).json(),null,2);});
action('export',()=>{if(imported){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='chatgpt-imported-receipts.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}else location.href='/api/export';});
action('collapse',()=>{const body=main().ownerDocument.body;body.classList.toggle('compact');$('collapse').textContent=body.classList.contains('compact')?'+':'−';});
action('float',async()=>{if(!window.documentPictureInPicture)throw Error('此浏览器不支持独立浮窗；可收起面板或单独开窗');if(pip&&!pip.closed){pip.focus();return;}const content=main();pip=await documentPictureInPicture.requestWindow({width:410,height:540});for(const style of document.querySelectorAll('style'))pip.document.head.append(style.cloneNode(true));pip.document.body.append(content);pip.addEventListener('pagehide',()=>{document.body.append(content);pip=null;},{once:true});});
main().querySelectorAll('[data-label]').forEach(b=>b.onclick=()=>control({action:'label',id:current.id,label:b.dataset.label}).catch(e=>{$('notice').textContent=e.message;}));
action('import',()=>{$('file').click();});$('file').onchange=async()=>{try{const f=$('file').files[0];if(!f)return;if(f.size>2_000_000)throw Error('导入上限 2 MB');const text=await f.text();let data;try{data=JSON.parse(text);}catch{data=text.split(/\r?\n/).filter(Boolean).map(l=>JSON.parse(l));}const records=Array.isArray(data)?data:data.records||[data];if(records.length>1000)throw Error('导入上限 1000 条');imported=true;render({...state,records});}catch(e){$('notice').textContent=e.message;}};
const events=new EventSource('/api/events');events.onmessage=e=>{if(!imported)render(JSON.parse(e.data));};events.onerror=()=>{$('status').textContent='本地回执服务已断开';$('enabled').checked=false;};
</script></html>
